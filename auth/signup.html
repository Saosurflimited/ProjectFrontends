<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link href="../src/output.css" rel="stylesheet" />
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
      rel="stylesheet"
    />

    <title>Sign Up | MTi</title>
  </head>

  <body class="min-h-screen bg-gray-100 flex items-center justify-center p-3">
    <main
      class="w-full max-w-md bg-white rounded-2xl shadow-xl overflow-hidden"
    >
      <header class="bg-black text-white text-center px-5 py-4">
        <div class="text-3xl text-red-500 mb-1">
          <i class="ri-graduation-cap-line"></i>
        </div>

        <h1 class="text-xl font-bold">MTi JavaScript Project</h1>

        <p class="text-gray-400 text-xs mt-1">Learn. Build. Grow.</p>
      </header>

      <section class="p-5 sm:p-6">
        <h2 class="text-xl font-bold text-gray-900">Create your account</h2>

        <p class="text-gray-500 text-sm mt-1 mb-4">
          Join us and start your learning journey.
        </p>

        <div
          id="responseMessage"
          class="hidden text-sm p-3 rounded-lg mb-3"
        ></div>

        <form id="signupForm" class="space-y-3">
          <!-- Full Name -->
          <div>
            <label
              for="name"
              class="block text-sm font-medium text-gray-700 mb-1"
            >
              Full Name
            </label>

            <input
              type="text"
              id="name"
              name="name"
              placeholder="Enter your full name"
              class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm outline-none focus:border-red-600 focus:ring-2 focus:ring-red-100"
              required
            />
          </div>

          <!-- Email -->
          <div>
            <label
              for="email"
              class="block text-sm font-medium text-gray-700 mb-1"
            >
              Email Address
            </label>

            <input
              type="email"
              id="email"
              name="email"
              placeholder="you@example.com"
              class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm outline-none focus:border-red-600 focus:ring-2 focus:ring-red-100"
              required
            />
          </div>

          <!-- Password -->
          <div>
            <label
              for="password"
              class="block text-sm font-medium text-gray-700 mb-1"
            >
              Password
            </label>

            <input
              type="password"
              id="password"
              name="password"
              placeholder="Create a password"
              class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm outline-none focus:border-red-600 focus:ring-2 focus:ring-red-100"
              required
            />
          </div>

          <!-- Confirm Password -->
          <div>
            <label
              for="confirmPassword"
              class="block text-sm font-medium text-gray-700 mb-1"
            >
              Confirm Password
            </label>

            <input
              type="password"
              id="confirmPassword"
              name="confirmPassword"
              placeholder="Enter password again"
              class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm outline-none focus:border-red-600 focus:ring-2 focus:ring-red-100"
              required
            />
          </div>

          <!-- Submit Button -->
          <button
            type="submit"
            class="w-full bg-red-600 hover:bg-red-700 text-white text-sm font-semibold py-2.5 rounded-lg transition duration-300"
          >
            Create Account
          </button>
        </form>

        <p class="text-center text-sm text-gray-600 mt-4">
          Already have an account?

          <a
            href="login.html"
            class="text-red-600 font-semibold hover:text-red-800"
          >
            Login
          </a>
        </p>
      </section>
    </main>

    <script src="../javascript/auth.js"></script>
  </body>
</html>
