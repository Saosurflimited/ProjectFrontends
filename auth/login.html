<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link href="../src/output.css" rel="stylesheet" />
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
      rel="stylesheet"
    />

    <title>Login | MTi</title>
  </head>

  <body class="min-h-screen bg-gray-100 flex items-center justify-center p-3">
    <main
      class="w-full max-w-md bg-white rounded-2xl shadow-xl overflow-hidden"
    >
      <!-- Header -->
      <header class="bg-black text-white text-center px-5 py-4">
        <div class="text-3xl text-red-500 mb-1">
          <i class="ri-graduation-cap-line"></i>
        </div>

        <h1 class="text-xl font-bold">MTi JavaScript Project</h1>

        <p class="text-gray-400 text-xs mt-1">Learn. Build. Grow.</p>
      </header>

      <!-- Login Form -->
      <section class="p-5 sm:p-6">
        <h2 class="text-xl font-bold text-gray-900">Welcome Back!</h2>

        <p class="text-gray-500 text-sm mt-1 mb-4">
          Login to continue your learning journey.
        </p>

        <form id="loginForm" class="space-y-3">
          <!-- Email -->
          <div>
            <label
              for="email"
              class="block text-sm font-medium text-gray-700 mb-1"
            >
              Email Address
            </label>

            <input
              type="email"
              id="email"
              name="email"
              placeholder="you@example.com"
              class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm outline-none focus:border-red-600 focus:ring-2 focus:ring-red-100"
              required
            />
          </div>

          <!-- Password -->
          <div>
            <label
              for="password"
              class="block text-sm font-medium text-gray-700 mb-1"
            >
              Password
            </label>

            <input
              type="password"
              id="password"
              name="password"
              placeholder="Enter your password"
              class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm outline-none focus:border-red-600 focus:ring-2 focus:ring-red-100"
              required
            />
          </div>

          <!-- Forgot Password -->
          <div class="flex justify-end">
            <a
              href="forgot-password.html"
              class="text-sm text-red-600 font-medium hover:text-red-800"
            >
              Forgot Password?
            </a>
          </div>

          <!-- Submit Button -->
          <button
            type="submit"
            class="w-full bg-red-600 hover:bg-red-700 text-white text-sm font-semibold py-2.5 rounded-lg transition duration-300"
          >
            Login
          </button>
        </form>

        <!-- Signup Link -->
        <p class="text-center text-sm text-gray-600 mt-4">
          Don't have an account?

          <a
            href="signup.html"
            class="text-red-600 font-semibold hover:text-red-800"
          >
            Sign Up
          </a>
        </p>
      </section>

      <!-- Footer -->
      <footer class="border-t border-gray-100 py-3 text-center">
        <p class="text-xs text-gray-400">
          &copy; 2026 MTi Courses. All rights reserved.
        </p>
      </footer>
    </main>

     <script src="../javascript/auth.js" ></script>
  </body>
</html>
